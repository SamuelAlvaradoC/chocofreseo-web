    <!-- Rendimiento: preconnect a orígenes externos usados desde el primer

    <!-- Open Graph (Facebook, WhatsApp, Instagram). Los crawlers NO ejecutan
         JS: estas etiquetas deben vivir aquí, en el HTML estático. Usar URLs

    <meta property="og:image" content="https://www.chocofreseo.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.chocofreseo.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
